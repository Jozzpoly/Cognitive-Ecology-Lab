name: Publish Owner preview
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Check"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cognitive-ecology-pages
  cancel-in-progress: true
jobs:
  publish:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.event == 'push')
      }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify the candidate is still latest main
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$SOURCE_SHA" = "$latest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Stale source ${SOURCE_SHA}; current main is ${latest}. Skip safely."
          fi
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.publish == 'true'
        with:
          node-version: '22'
      - name: Validate source
        if: steps.freshness.outputs.publish == 'true'
        run: npm run check
      - name: Withdraw published laboratory and assets
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' '<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><title></title></head><body></body></html>' > dist/index.html
          cp dist/index.html dist/404.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - uses: actions/configure-pages@v5
        if: steps.freshness.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.freshness.outputs.publish == 'true'
        with:
          path: dist
      - id: deployment
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
