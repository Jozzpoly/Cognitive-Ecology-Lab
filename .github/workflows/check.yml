name: Check
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Headless / deterministic tests
        run: npm run check
      - name: R0 bounded sensitivity sweep (descriptive only)
        run: node scripts/sweep.mjs
      - name: R1 honest negative-synergy and safety probe (descriptive only)
        run: node scripts/r1-probe.mjs
      - name: Real Chromium browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > /tmp/cel-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then echo "No Chromium/Chrome found — real-browser evidence unavailable"; exit 1; fi
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=3000 --dump-dom http://127.0.0.1:4173/r0.html > /tmp/cel-dom.html 2>/tmp/cel-chrome.log || { cat /tmp/cel-chrome.log; exit 1; }
          node scripts/assert-browser-dom.mjs /tmp/cel-dom.html
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:4173/r0.html?audit=1" > /tmp/cel-audit.html 2>/tmp/cel-chrome-audit.log || { cat /tmp/cel-chrome-audit.log; exit 1; }
          node scripts/assert-browser-dom.mjs /tmp/cel-audit.html --audit
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:4173/?smoke=1" > /tmp/cel-r1.html 2>/tmp/cel-chrome-r1.log || { cat /tmp/cel-chrome-r1.log; exit 1; }
          node scripts/assert-r1-dom.mjs /tmp/cel-r1.html
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:4173/?tour=shield" > /tmp/cel-r1-tour.html 2>/tmp/cel-chrome-tour.log || { cat /tmp/cel-chrome-tour.log; exit 1; }
          node scripts/assert-r1-dom.mjs /tmp/cel-r1-tour.html --tour
